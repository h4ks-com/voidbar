# Voidbar server configuration.
# Copy to voidbar.toml and adjust. All values can be overridden with
# VOIDBAR_* environment variables (VOIDBAR_SERVER_LISTEN, etc).

[server]
listen = "127.0.0.1:8080"
# Public URL clients use to reach this instance. Must include scheme.
public_url = "http://127.0.0.1:8080"

[storage]
# BadgerDB data directory.
path = "./data"

[auth]
# open | closed | invite
# closed: users are created via CLI (first user becomes admin automatically)
# invite: registration requires an invite code (see: voidbar invite create)
registration = "closed"
# Optional explicit path for the master encryption key.
# Default: <storage.path>/master.key (auto-generated on first run).
# master_key_path = "./data/master.key"

[client]
# Serve Voidbar's own loader page at "/". The loader downloads the frozen
# Discord web build from cdn_base at runtime and patches it in the browser;
# Voidbar itself stores and serves no Discord assets. Patched assets are
# cached in the browser's OPFS, so only the first boot hits the mirror.
enabled = false
# Base URL of a CORS-enabled mirror hosting the build. Recommended for
# production: an archive.org item (archive.org/download/... sends
# Access-Control-Allow-Origin: *). web.archive.org (Wayback) has no CORS
# and only works for local dev with browser security disabled.
# cdn_base = "https://archive.org/download/voidbar-client"
cdn_base = ""
# Optional subdirectory under cdn_base containing app.html (leave empty if
# app.html sits at the root).
# build = ""
# Name of the HTML entry when it is not "app.html".
# html = "app"
# OPT-IN: serve client assets through this instance (transparent disk cache)
# instead of the browser fetching them from cdn_base. This removes CORS
# issues entirely and lets the server recover files missing from a Wayback
# snapshot via the CDX API. However, the instance then distributes
# Discord-owned assets itself — the exposure that drew a C&D onto Fosscord.
# ONLY enable this on personal instances that are NOT reachable from the
# internet (localhost / LAN / VPN). Default: false.
proxy_cdn = false
# Local directory with a pre-downloaded build (see: voidbar mirror). When
# set, the proxy serves assets from disk - instant, offline, no mirror
# rate limits. Files missing on disk still fall back to cdn_base.
# mirror_dir = "./mirror-2022-06"
