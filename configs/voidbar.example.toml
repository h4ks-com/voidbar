# Voidbar server configuration.
# Copy to voidbar.toml and adjust. All values can be overridden with
# VOIDBAR_* environment variables (VOIDBAR_SERVER_LISTEN, etc).

[server]
listen = "127.0.0.1:8080"
# Public URL clients use to reach this instance. Must include scheme.
public_url = "http://127.0.0.1:8080"

[storage]
# BadgerDB data directory.
path = "./data"

[auth]
# open | closed | invite
# closed: users are created via CLI (first user becomes admin automatically)
# invite: registration requires an invite code (see: voidbar invite create)
registration = "closed"
# Optional explicit path for the master encryption key.
# Default: <storage.path>/master.key (auto-generated on first run).
# master_key_path = "./data/master.key"

[client]
# Serve Voidbar's own loader page at "/". The loader downloads the frozen
# Discord web build from cdn_base at runtime and patches it in the browser;
# Voidbar itself stores and serves no Discord assets.
enabled = false
# Base URL of a CORS-enabled mirror that hosts the build, e.g. an archive.org
# item. Must not have a trailing slash.
cdn_base = ""
# Build directory under cdn_base containing app.html and /assets.
# build = "january_15_2022"
