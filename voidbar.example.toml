# Voidbar server configuration.
# Copy to voidbar.toml and adjust. All values can be overridden with
# VOIDBAR_* environment variables (VOIDBAR_SERVER_LISTEN, etc).

[server]
listen = "127.0.0.1:8080"
# Public URL clients use to reach this instance. Must include scheme.
public_url = "http://127.0.0.1:8080"

[storage]
# BadgerDB data directory.
path = "./data"

[auth]
# open | closed
# closed: users are created via the CLI (voidbar user add); the first
# user becomes admin automatically
registration = "closed"
# Optional explicit path for the master encryption key.
# Default: <storage.path>/master.key (auto-generated on first run).
# master_key_path = "./data/master.key"
