# docker-compose for Voidbar (backend only).
#
#   docker compose build
#   docker compose up
#
# Then point a Discord client (e.g. an Android build repackaged with
# discord-apk-patcher) at http://127.0.0.1:18084/.

services:
  voidbar:
    build: .
    ports:
      - "127.0.0.1:18084:8080"
    environment:
      # inside the container we must listen on all interfaces
      VOIDBAR_SERVER_LISTEN: 0.0.0.0:8080
      VOIDBAR_SERVER_PUBLIC_URL: http://127.0.0.1:18084
      VOIDBAR_AUTH_REGISTRATION: open
    volumes:
      - ./data:/data
    restart: unless-stopped
